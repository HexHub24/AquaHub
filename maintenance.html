<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0c4a6e" />
    <title>Maintenance — AquaHub</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body class="app-body">
    <div class="app-layout">
      <button class="nav-mobile-toggle" id="navMobileToggle" aria-label="Open menu" type="button">☰</button>

      <aside class="app-sidebar" id="appSidebar">
        <div class="app-sidebar-head">
          <a href="/" class="app-sidebar-brand">
            <span class="app-sidebar-brand-icon">🐠</span>
            <span class="app-sidebar-brand-text">AquaHub</span>
          </a>
          <button class="nav-sidebar-close" id="navSidebarClose" aria-label="Close menu" type="button">×</button>
        </div>
        <nav class="app-sidebar-nav">
          <a href="/app.html"><span class="nav-icon">🏠</span><span class="nav-label">Dashboard</span></a>
          <a href="/tanks.html"><span class="nav-icon">🐠</span><span class="nav-label">My Tanks</span></a>
          <a href="/species.html"><span class="nav-icon">🌿</span><span class="nav-label">Species</span></a>
          <a href="/bioload.html"><span class="nav-icon">📊</span><span class="nav-label">Bioload</span></a>
          <a href="/maintenance.html" class="active"><span class="nav-icon">🔧</span><span class="nav-label">Maintenance</span></a>
          <span class="app-sidebar-disabled"><span class="nav-icon">📈</span><span class="nav-label">Trends</span><span class="nav-soon">Soon</span></span>
        </nav>
        <div class="app-sidebar-foot">
          <div class="app-user" id="appUser">…</div>
          <button class="btn-secondary btn-sidebar" id="logoutBtn" type="button">Sign Out</button>
        </div>
      </aside>

      <div class="app-sidebar-backdrop" id="appSidebarBackdrop"></div>

      <main class="app-content">
        <header class="app-content-head">
          <div>
            <h1 class="page-title">Maintenance</h1>
            <p class="text-muted" id="maintSubtitle">Loading…</p>
          </div>
        </header>

        <div id="maintAlert" class="alert" role="alert"></div>

        <div id="maintLoading" class="empty-state">Loading tasks…</div>

        <div id="maintEmptyAll" class="empty-state" style="display: none">
          <div class="empty-icon">🔧</div>
          <h3>No maintenance tasks yet</h3>
          <p class="text-muted">Open a tank's detail page to add recurring tasks like water changes, filter rinsing, and parameter testing.</p>
          <a href="/tanks.html" class="btn-primary btn-inline">Go to my tanks</a>
        </div>

        <div id="maintByTank" style="display: none"></div>
      </main>
    </div>

    <script type="module">
      import { supabase, requireAuth } from '/lib/supabase.js';
      import { taskStatus, statusMeta as maintStatusMeta, formatInterval, formatRelativeDue, nextDue } from '/lib/maintenance.js';

      const user = await requireAuth();
      if (!user) throw new Error('not authenticated');
      document.getElementById('appUser').textContent = user.email;

      function escapeHtml(s) {
        if (s === null || s === undefined) return '';
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
      }

      const subtitleEl = document.getElementById('maintSubtitle');
      const alertEl = document.getElementById('maintAlert');
      const loadingEl = document.getElementById('maintLoading');
      const emptyEl = document.getElementById('maintEmptyAll');
      const listEl = document.getElementById('maintByTank');

      async function load() {
        const [tanksRes, tasksRes] = await Promise.all([
          supabase.from('tanks').select('id, name, tank_type, volume_gallons').order('name'),
          supabase.from('maintenance_tasks').select('*').eq('is_active', true),
        ]);
        loadingEl.style.display = 'none';

        if (tanksRes.error) {
          alertEl.textContent = `Could not load tanks: ${tanksRes.error.message}`;
          alertEl.className = 'alert show alert-error';
          return;
        }
        const tanks = tanksRes.data || [];
        const tasks = tasksRes.data || [];

        if (tasks.length === 0) {
          emptyEl.style.display = 'block';
          subtitleEl.textContent = 'No active tasks';
          return;
        }

        // Group tasks by tank
        const byTank = {};
        for (const t of tasks) {
          if (!byTank[t.tank_id]) byTank[t.tank_id] = [];
          byTank[t.tank_id].push(t);
        }

        // Tally counts
        let overdue = 0, dueSoon = 0;
        for (const t of tasks) {
          const s = taskStatus(t);
          if (s.status === 'overdue') overdue++;
          else if (s.status === 'due_soon') dueSoon++;
        }
        const subtitleParts = [];
        if (overdue > 0) subtitleParts.push(`${overdue} overdue`);
        if (dueSoon > 0) subtitleParts.push(`${dueSoon} due soon`);
        subtitleParts.push(`${tasks.length} active tasks across ${Object.keys(byTank).length} tank${Object.keys(byTank).length === 1 ? '' : 's'}`);
        subtitleEl.textContent = subtitleParts.join(' · ');

        // Render — sort tanks by their most-urgent task
        const tankOrder = tanks
          .filter((t) => byTank[t.id])
          .map((tank) => {
            const tasksForTank = byTank[tank.id].slice().sort((a, b) => nextDue(a) - nextDue(b));
            const mostUrgent = taskStatus(tasksForTank[0]);
            return { tank, tasks: tasksForTank, urgency: mostUrgent };
          })
          .sort((a, b) => {
            const rank = { overdue: 0, due_soon: 1, never_done: 2, on_track: 3 };
            return rank[a.urgency.status] - rank[b.urgency.status];
          });

        listEl.innerHTML = tankOrder.map(({ tank, tasks }) => {
          const rows = tasks.map((t) => {
            const s = taskStatus(t);
            const meta = maintStatusMeta(s.status);
            return `
              <li class="maint-task maint-tone-${meta.tone}">
                <div class="maint-task-main">
                  <div class="maint-task-title">${escapeHtml(t.title)}</div>
                  <div class="maint-task-meta">
                    <span>${formatInterval(t.interval_days)}</span>
                    <span class="maint-task-due">${formatRelativeDue(s)}</span>
                  </div>
                  ${t.notes ? `<div class="maint-task-notes">${escapeHtml(t.notes)}</div>` : ''}
                </div>
                <div class="maint-task-actions">
                  <button type="button" class="maint-done-btn" data-id="${t.id}" data-title="${escapeHtml(t.title)}" data-tank="${tank.id}">Done</button>
                </div>
              </li>
            `;
          }).join('');

          return `
            <section class="maint-tank-block">
              <header class="maint-tank-head">
                <a href="/tank.html?id=${tank.id}">
                  <h2>${escapeHtml(tank.name)}</h2>
                  <span class="maint-tank-meta">${escapeHtml(tank.tank_type || '')}${tank.volume_gallons ? ` · ${tank.volume_gallons} gal` : ''} →</span>
                </a>
              </header>
              <ul class="maint-task-list">${rows}</ul>
            </section>
          `;
        }).join('');

        listEl.style.display = 'block';

        // Wire "Done" buttons
        listEl.querySelectorAll('.maint-done-btn').forEach((btn) => {
          btn.addEventListener('click', async () => {
            const { error } = await supabase.from('maintenance_logs').insert({
              user_id: user.id,
              tank_id: btn.dataset.tank,
              task_id: btn.dataset.id,
              title: btn.dataset.title,
              done_at: new Date().toISOString(),
            });
            if (error) {
              alertEl.textContent = `Could not log: ${error.message}`;
              alertEl.className = 'alert show alert-error';
              return;
            }
            // Reload
            loadingEl.style.display = 'block';
            listEl.style.display = 'none';
            listEl.innerHTML = '';
            emptyEl.style.display = 'none';
            await load();
          });
        });
      }

      document.getElementById('logoutBtn').addEventListener('click', async () => {
        await supabase.auth.signOut();
        window.location.href = '/login.html';
      });
      const sidebar = document.getElementById('appSidebar');
      const sidebarBackdrop = document.getElementById('appSidebarBackdrop');
      document.getElementById('navMobileToggle').addEventListener('click', () => {
        sidebar.classList.add('open'); sidebarBackdrop.classList.add('open');
      });
      const closeNav = () => { sidebar.classList.remove('open'); sidebarBackdrop.classList.remove('open'); };
      document.getElementById('navSidebarClose').addEventListener('click', closeNav);
      sidebarBackdrop.addEventListener('click', closeNav);

      load();
    </script>
  </body>
</html>

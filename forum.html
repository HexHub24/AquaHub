<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0c4a6e" />
    <title>Forum — AquaHub</title>
    <meta name="description" content="AquaHub community forum — discuss aquariums, share your tank, ask for help, and connect with other hobbyists." />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/marketing.css" />
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body class="forum-page-body">
    <!-- Marketing nav (logged-out) -->

    <!-- App layout (logged-in) -->
    <div id="topNavRoot"></div>

    <main class="app-page app-page-forum">
      <div class="forum-container">
        <header class="forum-header">
          <div>
            <h1 class="page-title">Forum</h1>
            <p class="text-muted" id="forumSubtitle">Discuss aquariums with other hobbyists</p>
          </div>
          <a id="newThreadCta" href="/forum-compose.html" class="btn-primary btn-inline">+ New thread</a>
        </header>

        <div id="forumAlert" class="alert" role="alert"></div>
        <div id="forumLoading" class="empty-state">Loading…</div>

        <div id="forumContent" style="display: none">
          <section class="forum-section">
            <h2 class="section-heading">Categories</h2>
            <ul id="categoryList" class="forum-category-list"></ul>
          </section>

          <section class="forum-section">
            <h2 class="section-heading">Recent activity</h2>
            <ul id="recentList" class="forum-thread-list"></ul>
            <p id="recentEmpty" class="text-muted" style="display: none">No threads yet. Be the first!</p>
          </section>
        </div>
      </div>
    </main>

    <script type="module">
      import { supabase, getCurrentUser } from '/lib/supabase.js';
      import { mountTopNav } from '/lib/topnav.js';
      import { snippet, timeAgo, fullTime } from '/lib/forum.js';

      const user = await getCurrentUser();
      await mountTopNav('forum', { publicMode: true });

      function escapeHtml(s) {
        if (s === null || s === undefined) return '';
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
      }

      function showAlert(message) {
        const el = document.getElementById('forumAlert');
        el.textContent = message;
        el.className = 'alert show alert-error';
      }

      // ---- Load categories + recent activity in parallel ----
      async function load() {
        const [catsRes, recentRes] = await Promise.all([
          supabase
            .from('forum_categories')
            .select('*')
            .eq('is_active', true)
            .order('display_order'),
          supabase
            .from('forum_threads')
            .select('id, title, category_id, last_reply_at, reply_count, created_at, author_id')
            .eq('is_hidden', false)
            .order('last_reply_at', { ascending: false })
            .limit(10),
        ]);

        document.getElementById('forumLoading').style.display = 'none';

        if (catsRes.error) { showAlert(`Could not load: ${catsRes.error.message}`); return; }
        const cats = catsRes.data || [];
        const recent = recentRes.data || [];

        // Resolve author display names + thread counts per category in one extra query
        const authorIds = [...new Set(recent.map((t) => t.author_id).filter(Boolean))];
        let authorNameMap = {};
        if (authorIds.length) {
          const { data: profs } = await supabase
            .from('forum_user_profiles')
            .select('user_id, display_name')
            .in('user_id', authorIds);
          (profs || []).forEach((p) => { authorNameMap[p.user_id] = p.display_name; });
        }

        // Count threads per category
        const countsByCategory = {};
        for (const t of recent) {
          countsByCategory[t.category_id] = (countsByCategory[t.category_id] || 0) + 1;
        }
        // For each category, ALSO fetch the latest thread (we only have last 10 across all)
        // — but that's enough for a v1 homepage. Production would do per-category counts in SQL.

        document.getElementById('forumContent').style.display = 'block';

        // Render categories
        document.getElementById('categoryList').innerHTML = cats.map((c) => {
          const latestForCat = recent.find((t) => t.category_id === c.id);
          return `
            <li class="forum-category-row">
              <a href="/forum-category.html?slug=${encodeURIComponent(c.slug)}" class="forum-category-link">
                <div class="forum-category-main">
                  <h3>${escapeHtml(c.name)}</h3>
                  <p class="forum-category-desc">${escapeHtml(c.description || '')}</p>
                </div>
                <div class="forum-category-meta">
                  ${latestForCat
                    ? `<div class="forum-category-latest">
                         <div class="forum-latest-title">${escapeHtml(latestForCat.title)}</div>
                         <div class="forum-latest-by">${timeAgo(latestForCat.last_reply_at)}</div>
                       </div>`
                    : `<div class="forum-category-latest text-muted">No threads yet</div>`}
                </div>
              </a>
            </li>
          `;
        }).join('');

        // Render recent activity
        const recentEl = document.getElementById('recentList');
        const emptyEl = document.getElementById('recentEmpty');
        if (recent.length === 0) {
          recentEl.style.display = 'none';
          emptyEl.style.display = 'block';
        } else {
          recentEl.style.display = '';
          emptyEl.style.display = 'none';
          recentEl.innerHTML = recent.map((t) => {
            const cat = cats.find((c) => c.id === t.category_id);
            const authorName = authorNameMap[t.author_id] || 'Someone';
            return `
              <li class="forum-thread-row">
                <a href="/forum-thread.html?id=${t.id}" class="forum-thread-link">
                  <div class="forum-thread-main">
                    <div class="forum-thread-title">${escapeHtml(t.title)}</div>
                    <div class="forum-thread-meta">
                      <span class="forum-category-pill">${escapeHtml(cat?.name || 'Category')}</span>
                      <span>by <strong>${escapeHtml(authorName)}</strong></span>
                      <span title="${fullTime(t.last_reply_at)}">${timeAgo(t.last_reply_at)}</span>
                    </div>
                  </div>
                  <div class="forum-thread-counts">
                    <div class="forum-reply-count">${t.reply_count}</div>
                    <div class="forum-reply-label">${t.reply_count === 1 ? 'reply' : 'replies'}</div>
                  </div>
                </a>
              </li>
            `;
          }).join('');
        }
      }

      load();
    </script>
  </body>
</html>

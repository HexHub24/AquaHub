<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0c4a6e" />
    <title>AquaHub</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <span class="header-link">🐠 AquaHub</span>
        <button id="logoutBtn" class="btn-link" type="button">Sign Out</button>
      </header>

      <main class="app-main">
        <div class="card">
          <h2>Welcome 👋</h2>
          <p class="text-muted" id="userEmail">Loading your account…</p>
        </div>

        <div class="dashboard-grid">
          <a class="dashboard-tile" href="/tanks.html">
            <div class="dashboard-tile-icon">🐠</div>
            <div class="dashboard-tile-title">My Tanks</div>
            <div class="dashboard-tile-meta" id="tankCountMeta">—</div>
          </a>

          <div class="dashboard-tile dashboard-tile-disabled" aria-disabled="true">
            <div class="dashboard-tile-icon">🌿</div>
            <div class="dashboard-tile-title">Species Library</div>
            <div class="dashboard-tile-meta">Coming soon</div>
          </div>

          <div class="dashboard-tile dashboard-tile-disabled" aria-disabled="true">
            <div class="dashboard-tile-icon">📊</div>
            <div class="dashboard-tile-title">Bioload Calculator</div>
            <div class="dashboard-tile-meta">Coming soon</div>
          </div>
        </div>
      </main>
    </div>

    <script type="module">
      import { supabase, requireAuth } from '/lib/supabase.js';

      const user = await requireAuth();
      if (user) {
        document.getElementById('userEmail').textContent =
          `Signed in as ${user.email}`;

        // Get tank count for the dashboard tile
        const { count } = await supabase
          .from('tanks')
          .select('*', { count: 'exact', head: true });

        const meta = document.getElementById('tankCountMeta');
        if (count === null || count === undefined) {
          meta.textContent = 'View tanks';
        } else if (count === 0) {
          meta.textContent = 'Add your first tank';
        } else {
          meta.textContent = `${count} ${count === 1 ? 'tank' : 'tanks'}`;
        }
      }

      document.getElementById('logoutBtn').addEventListener('click', async () => {
        await supabase.auth.signOut();
        window.location.href = '/login.html';
      });
    </script>
  </body>
</html>

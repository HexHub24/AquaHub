<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0c4a6e" />
    <title>Dashboard — AquaHub</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body class="app-body">
    <div id="topNavRoot"></div>

    <main class="app-page">
      <header class="app-content-head">
        <h1 class="page-title">Dashboard</h1>
      </header>

      <section class="card welcome-card">
        <h2 id="greeting">Welcome 👋</h2>
        <p class="text-muted" id="greetingSub">Loading your account…</p>
      </section>

      <h2 class="section-heading">Your aquariums</h2>
      <div class="dashboard-grid">
        <a class="dashboard-tile dashboard-tile-primary" href="/tanks.html">
          <div class="dashboard-tile-icon">🐠</div>
          <div class="dashboard-tile-title">My Tanks</div>
          <div class="dashboard-tile-meta" id="tankCountMeta">—</div>
        </a>

        <a class="dashboard-tile" href="/species.html">
          <div class="dashboard-tile-icon">🌿</div>
          <div class="dashboard-tile-title">Species Library</div>
          <div class="dashboard-tile-meta">Browse →</div>
        </a>

        <a class="dashboard-tile" href="/bioload.html">
          <div class="dashboard-tile-icon">📊</div>
          <div class="dashboard-tile-title">Bioload Calculator</div>
          <div class="dashboard-tile-meta">Plan stocking →</div>
        </a>

        <a class="dashboard-tile" href="/trends.html" id="trendsTile">
          <div class="dashboard-tile-icon">📈</div>
          <div class="dashboard-tile-title">Trends & Logs</div>
          <div class="dashboard-tile-meta" id="trendsCountMeta">—</div>
        </a>

        <a class="dashboard-tile" href="/forum.html">
          <div class="dashboard-tile-icon">💬</div>
          <div class="dashboard-tile-title">Forum</div>
          <div class="dashboard-tile-meta">Join the conversation →</div>
        </a>

        <a class="dashboard-tile" href="/stores.html">
  <div class="dashboard-tile-icon">📍</div>
  <div class="dashboard-tile-title">LFS Finder</div>
  <div class="dashboard-tile-meta">Find & rate local stores</div>
</a>
      </div>
    </main>

    <script type="module">
      import { supabase, requireAuth } from '/lib/supabase.js';
      import { mountTopNav } from '/lib/topnav.js';
      import { taskStatus } from '/lib/maintenance.js';

      const user = await requireAuth();
      await mountTopNav('dashboard');

      if (user) {
        document.getElementById('greetingSub').textContent = `Signed in as ${user.email}`;

        const { count } = await supabase
          .from('tanks')
          .select('*', { count: 'exact', head: true });

        const meta = document.getElementById('tankCountMeta');
        if (count === null || count === undefined) {
          meta.textContent = 'View tanks';
        } else if (count === 0) {
          meta.textContent = 'Add your first tank →';
        } else {
          meta.textContent = `${count} ${count === 1 ? 'tank' : 'tanks'} →`;
        }

        // Trends & Logs tile — surface overdue maintenance + recent activity count
        const { data: tasks } = await supabase
          .from('maintenance_tasks').select('*').eq('is_active', true);
        const trendsMeta = document.getElementById('trendsCountMeta');
        const tile = document.getElementById('trendsTile');
        if (tasks && tasks.length) {
          let overdue = 0, dueSoon = 0;
          for (const t of tasks) {
            const s = taskStatus(t);
            if (s.status === 'overdue') overdue++;
            else if (s.status === 'due_soon') dueSoon++;
          }
          if (overdue > 0) {
            trendsMeta.innerHTML = `<span class="tile-badge tile-badge-danger">${overdue} overdue</span>`;
            tile.classList.add('dashboard-tile-alert');
          } else if (dueSoon > 0) {
            trendsMeta.innerHTML = `<span class="tile-badge tile-badge-warning">${dueSoon} due soon</span>`;
          } else {
            trendsMeta.textContent = 'View trends & history →';
          }
        } else {
          trendsMeta.textContent = 'View trends & history →';
        }
      }
    </script>
  </body>
</html>

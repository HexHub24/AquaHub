<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0c4a6e" />
    <title>AquaHub</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <h1>🐠 AquaHub</h1>
        <button id="logoutBtn" class="btn-link" type="button">Sign Out</button>
      </header>

      <main class="app-main">
        <div class="card">
          <h2>Welcome 👋</h2>
          <p class="text-muted" id="userEmail">Loading your account…</p>
        </div>

        <div class="card">
          <h2>What's next</h2>
          <p class="text-muted">
            Tanks, livestock, and water tests are coming soon. This is the
            account shell — auth and database are wired up.
          </p>
        </div>
      </main>
    </div>

    <script type="module">
      import { supabase, requireAuth } from '/lib/supabase.js';

      const user = await requireAuth();
      if (user) {
        document.getElementById('userEmail').textContent =
          `Signed in as ${user.email}`;
      }

      document.getElementById('logoutBtn').addEventListener('click', async () => {
        await supabase.auth.signOut();
        window.location.href = '/login.html';
      });
    </script>
  </body>
</html>

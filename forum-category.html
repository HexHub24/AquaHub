<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0c4a6e" />
    <title>Forum — AquaHub</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/marketing.css" />
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body class="forum-page-body">
    <div id="topNavRoot"></div>

    <main class="app-page app-page-forum">
      <div class="forum-container">
        <div class="breadcrumb">
          <a href="/forum.html">← Forum</a>
        </div>

        <header class="forum-header">
          <div>
            <h1 class="page-title" id="categoryName">Loading…</h1>
            <p class="text-muted" id="categoryDesc"></p>
          </div>
          <a id="newThreadCta" href="/forum-compose.html" class="btn-primary btn-inline">+ New thread</a>
        </header>

        <div id="forumAlert" class="alert" role="alert"></div>

        <div class="form-row" style="max-width: 560px; margin-bottom: 14px; display: flex; gap: 16px; align-items: end;">
          <div class="form-group" style="max-width: 240px; flex: 1;">
            <label class="form-label" for="sortSelect">Sort</label>
            <select id="sortSelect" class="form-input">
              <option value="last_reply">Newest reply</option>
              <option value="newest">Newest thread</option>
              <option value="most_replies">Most replies</option>
            </select>
          </div>
          <div id="mpActiveOnlyWrap" class="form-group" style="display:none; padding-bottom: 8px;">
            <label class="mp-active-toggle">
              <input id="mpActiveOnly" type="checkbox" checked />
              <span>Active only (hide sold / found / traded)</span>
            </label>
          </div>
        </div>

        <div id="threadLoading" class="empty-state">Loading threads…</div>
        <div id="threadEmpty" class="empty-state" style="display: none">
          <div class="empty-icon">💬</div>
          <h3>No threads yet</h3>
          <p class="text-muted">Be the first to post in this category.</p>
        </div>
        <ul id="threadList" class="forum-thread-list" style="display: none"></ul>

        <div id="pagination" class="forum-pagination" style="display: none">
          <button id="prevBtn" class="btn-secondary btn-sm" type="button">← Prev</button>
          <span id="pageInfo"></span>
          <button id="nextBtn" class="btn-secondary btn-sm" type="button">Next →</button>
        </div>
      </div>
    </main>

    <script type="module">
      import { supabase, getCurrentUser } from '/lib/supabase.js';
      import { mountTopNav } from '/lib/topnav.js';
      import { timeAgo, fullTime } from '/lib/forum.js';
      import {
        MARKETPLACE_CATEGORY_SLUG,
        isMarketplaceSlug,
        marketplacePrefix,
        marketplacePrefixClass,
        renderMarketplaceMetaStrip,
      } from '/lib/marketplace.js';

      const params = new URLSearchParams(window.location.search);
      const slug = params.get('slug');

      const user = await getCurrentUser();
      await mountTopNav('forum', { publicMode: true });

      function escapeHtml(s) {
        if (s === null || s === undefined) return '';
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
      }
      function showAlert(message) {
        const el = document.getElementById('forumAlert');
        el.textContent = message;
        el.className = 'alert show alert-error';
      }

      const PAGE_SIZE = 20;
      let category = null;
      let currentPage = 0;
      let currentSort = 'last_reply';
      let activeOnly = true; // marketplace default: hide resolved

      async function load() {
        if (!slug) { showAlert('No category specified.'); return; }

        const { data: catRow, error: catErr } = await supabase
          .from('forum_categories').select('*').eq('slug', slug).maybeSingle();
        if (catErr || !catRow) { showAlert('Category not found.'); return; }
        category = catRow;

        document.getElementById('categoryName').textContent = catRow.name;
        document.getElementById('categoryDesc').textContent = catRow.description || '';

        // Show section in breadcrumb
        const sectionLabels = {
          freshwater: 'Freshwater',
          saltwater: 'Saltwater',
          paludarium: 'Terrariums, Paludariums & More',
          marketplace: 'Marketplace',
        };
        if (catRow.section && sectionLabels[catRow.section]) {
          const bc = document.querySelector('.breadcrumb');
          if (bc) {
            bc.innerHTML = `<a href="/forum.html">← Forum</a> <span class="breadcrumb-sep">·</span> <span class="breadcrumb-section">${escapeHtml(sectionLabels[catRow.section])}</span>`;
          }
        }
        if (user) {
          document.getElementById('newThreadCta').href = `/forum-compose.html?cat=${encodeURIComponent(slug)}`;
        }

        // Show "active only" toggle if this is a marketplace category
        if (isMarketplaceSlug(slug)) {
          document.getElementById('mpActiveOnlyWrap').style.display = '';
        }

        await loadThreads();
      }

      async function loadThreads() {
        document.getElementById('threadLoading').style.display = 'block';
        document.getElementById('threadEmpty').style.display = 'none';
        document.getElementById('threadList').style.display = 'none';
        document.getElementById('pagination').style.display = 'none';

        const from = currentPage * PAGE_SIZE;
        const to = from + PAGE_SIZE - 1;

        let query = supabase
          .from('forum_threads')
          .select('id, title, body, created_at, last_reply_at, reply_count, author_id, last_reply_author_id, is_pinned, is_locked, marketplace_kind, marketplace_status, marketplace_meta', { count: 'exact' })
          .eq('category_id', category.id)
          .eq('is_hidden', false);

        // Marketplace: optionally hide resolved
        if (isMarketplaceSlug(slug) && activeOnly) {
          // Show: status='active' OR status IS NULL (legacy pre-marketplace threads)
          query = query.or('marketplace_status.eq.active,marketplace_status.is.null');
        }

        if (currentSort === 'last_reply') {
          query = query.order('is_pinned', { ascending: false }).order('last_reply_at', { ascending: false });
        } else if (currentSort === 'newest') {
          query = query.order('is_pinned', { ascending: false }).order('created_at', { ascending: false });
        } else if (currentSort === 'most_replies') {
          query = query.order('is_pinned', { ascending: false }).order('reply_count', { ascending: false });
        }

        const { data: threads, count, error } = await query.range(from, to);

        document.getElementById('threadLoading').style.display = 'none';

        if (error) { showAlert(`Could not load: ${error.message}`); return; }

        if (!threads || threads.length === 0) {
          document.getElementById('threadEmpty').style.display = 'block';
          return;
        }

        const authorIds = [...new Set([
          ...threads.map((t) => t.author_id),
          ...threads.map((t) => t.last_reply_author_id),
        ].filter(Boolean))];
        let nameMap = {};
        if (authorIds.length) {
          const { data: profs } = await supabase
            .from('forum_user_profiles').select('user_id, display_name').in('user_id', authorIds);
          (profs || []).forEach((p) => { nameMap[p.user_id] = p.display_name; });
        }

        const list = document.getElementById('threadList');
        list.style.display = '';
        list.innerHTML = threads.map((t) => {
          const author = nameMap[t.author_id] || 'Someone';
          const lastReplyAuthor = nameMap[t.last_reply_author_id] || author;
          const isLastReplyFromAuthor = !t.last_reply_author_id || t.last_reply_author_id === t.author_id;

          // Marketplace prefix
          const mpPrefix = marketplacePrefix(t.marketplace_kind, t.marketplace_status);
          const mpClass = marketplacePrefixClass(t.marketplace_kind, t.marketplace_status);
          const isResolved = t.marketplace_kind && t.marketplace_status === 'resolved';

          // Marketplace meta strip (small version below title)
          const mpMetaHtml = (t.marketplace_kind && !isResolved)
            ? renderMarketplaceMetaStrip(t.marketplace_meta || {})
            : '';

          return `
            <li class="forum-thread-row ${t.is_pinned ? 'forum-thread-pinned' : ''} ${isResolved ? 'mp-resolved' : ''}">
              <a href="/forum-thread.html?id=${t.id}" class="forum-thread-link">
                <div class="forum-thread-main">
                  <div class="forum-thread-title">
                    ${t.is_pinned ? '<span class="forum-thread-badge">📌 Pinned</span>' : ''}
                    ${t.is_locked && !isResolved ? '<span class="forum-thread-badge">🔒 Locked</span>' : ''}
                    ${mpPrefix ? `<span class="${mpClass}">${mpPrefix}</span>` : ''}
                    ${escapeHtml(t.title)}
                  </div>
                  ${mpMetaHtml ? `<div class="mp-meta-strip" style="margin: 6px 0 0;">${mpMetaHtml}</div>` : ''}
                  <div class="forum-thread-meta">
                    <span>by <strong>${escapeHtml(author)}</strong></span>
                    <span title="${fullTime(t.created_at)}">${timeAgo(t.created_at)}</span>
                    ${t.reply_count > 0 && !isLastReplyFromAuthor
                      ? `<span class="text-muted">· last by <strong>${escapeHtml(lastReplyAuthor)}</strong> ${timeAgo(t.last_reply_at)}</span>`
                      : ''}
                  </div>
                </div>
                <div class="forum-thread-counts">
                  <div class="forum-reply-count">${t.reply_count}</div>
                  <div class="forum-reply-label">${t.reply_count === 1 ? 'reply' : 'replies'}</div>
                </div>
              </a>
            </li>
          `;
        }).join('');

        // Pagination
        const totalPages = Math.max(1, Math.ceil((count || 0) / PAGE_SIZE));
        if (totalPages > 1) {
          document.getElementById('pagination').style.display = 'flex';
          document.getElementById('pageInfo').textContent = `Page ${currentPage + 1} of ${totalPages}`;
          document.getElementById('prevBtn').disabled = currentPage === 0;
          document.getElementById('nextBtn').disabled = currentPage >= totalPages - 1;
        }
      }

      document.getElementById('sortSelect').addEventListener('change', (e) => {
        currentSort = e.target.value;
        currentPage = 0;
        loadThreads();
      });
      document.getElementById('mpActiveOnly').addEventListener('change', (e) => {
        activeOnly = e.target.checked;
        currentPage = 0;
        loadThreads();
      });
      document.getElementById('prevBtn').addEventListener('click', () => {
        if (currentPage > 0) { currentPage--; loadThreads(); window.scrollTo({ top: 0 }); }
      });
      document.getElementById('nextBtn').addEventListener('click', () => {
        currentPage++; loadThreads(); window.scrollTo({ top: 0 });
      });

      load();
    </script>
  </body>
</html>
